<!DOCTYPE html>
<html>
<head>
    <title>Pass or Fail</title>
</head>
<body>

    <h2>Examination Result</h2>

    <p id="result"></p>

    <script>
        let mark = 75;

        if (mark >= 50) {
            document.getElementById("result").innerHTML =
            "PASS";
        }
        else {
            document.getElementById("result").innerHTML =
            "FAIL";
        }
    </script>

</body>
</html>
