<!DOCTYPE html>
<html>
<head>
    <title>Positive or Negative</title>
</head>
<body>

    <h2>Check Number</h2>

    <p id="result"></p>

    <script>
        let number = -8;

        if (number > 0) {
            document.getElementById("result").innerHTML =
            "The number is Positive";
        }
        else if (number < 0) {
            document.getElementById("result").innerHTML =
            "The number is Negative";
        }
        else {
            document.getElementById("result").innerHTML =
            "The number is Zero";
        }
    </script>

</body>
</html>
